<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premire Auto Showroom</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@6.26.0/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
    }
    .animate-slide-in {
      animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-pop {
      animation: pop 0.3s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .hover-scale:hover {
      transform: scale(1.05);
      transition: transform 0.3s ease;
    }
    .shadow-glow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .shadow-glow:hover {
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const App = () => {
      const [cars, setCars] = useState([]);
      const [soldCars, setSoldCars] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [showAddForm, setShowAddForm] = useState(false);
      const [showPopup, setShowPopup] = useState(false);
      const [newCar, setNewCar] = useState({
        name: '', model: '', price: '', fuelType: '', engine: '', imageUrl: ''
      });

      const totalRevenue = soldCars.reduce((sum, car) => sum + parseFloat(car.price || 0), 0);

      const handleAddCar = (e) => {
        e.preventDefault();
        setCars([...cars, { ...newCar, id: Date.now() }]);
        setNewCar({ name: '', model: '', price: '', fuelType: '', engine: '', imageUrl: '' });
        setShowAddForm(false);
      };

      const handleSellCar = (car) => {
        setCars(cars.filter(c => c.id !== car.id));
        setSoldCars([...soldCars, car]);
        setShowPopup(true);
        setTimeout(() => setShowPopup(false), 3000);
      };

      const handleRemoveCar = (carId) => {
        setCars(cars.filter(c => c.id !== carId));
      };

      const filteredCars = cars.filter(car =>
        car.name.toLowerCase().includes(searchTerm.toLowerCase())
      );

      return (
        <div className="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100">
          {/* Navigation Bar */}
          <nav className="bg-gradient-to-r from-blue-700 to-blue-900 text-white p-6 shadow-lg">
            <div className="container mx-auto flex justify-between items-center">
              <h1 className="text-3xl font-bold tracking-tight">Premire Auto Showroom</h1>
              <div className="text-sm">Premium Car Inventory Management</div>
            </div>
          </nav>

          {/* Main Content */}
          <div className="container mx-auto p-6">
            {/* Stats Section */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
              <div className="bg-white p-6 rounded-xl shadow-glow hover-scale animate-slide-in">
                <h2 className="text-lg font-semibold text-gray-700">Total Cars Available</h2>
                <p className="text-3xl font-bold text-blue-600">{cars.length}</p>
              </div>
              <div className="bg-white p-6 rounded-xl shadow-glow hover-scale animate-slide-in">
                <h2 className="text-lg font-semibold text-gray-700">Total Cars Sold</h2>
                <p className="text-3xl font-bold text-blue-600">{soldCars.length}</p>
              </div>
              <div className="bg-white p-6 rounded-xl shadow-glow hover-scale animate-slide-in">
                <h2 className="text-lg font-semibold text-gray-700">Total Revenue</h2>
                <p className="text-3xl font-bold text-blue-600">${totalRevenue.toLocaleString()}</p>
              </div>
            </div>

            {/* Search Bar */}
            <div className="mb-8 flex justify-center">
              <input
                type="text"
                placeholder="Search cars by name..."
                className="w-full max-w-lg p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>

            {/* Add Car Button */}
            <div className="flex justify-end mb-6">
              <button
                className="bg-blue-600 text-white px-6 py-3 rounded-lg shadow-lg hover:bg-blue-700 transition-colors duration-300"
                onClick={() => setShowAddForm(!showAddForm)}
              >
                {showAddForm ? 'Cancel' : 'Add New Car'}
              </button>
            </div>

            {/* Add Car Form */}
            {showAddForm && (
              <div className="bg-white p-8 rounded-xl shadow-glow mb-8 animate-slide-in">
                <h2 className="text-2xl font-semibold text-gray-800 mb-6">Add New Car</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <input
                    type="text"
                    placeholder="Car Name"
                    className="p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={newCar.name}
                    onChange={(e) => setNewCar({ ...newCar, name: e.target.value })}
                  />
                  <input
                    type="text"
                    placeholder="Model"
                    className="p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={newCar.model}
                    onChange={(e) => setNewCar({ ...newCar, model: e.target.value })}
                  />
                  <input
                    type="number"
                    placeholder="Price"
                    className="p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={newCar.price}
                    onChange={(e) => setNewCar({ ...newCar, price: e.target.value })}
                  />
                  <input
                    type="text"
                    placeholder="Fuel Type"
                    className="p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={newCar.fuelType}
                    onChange={(e) => setNewCar({ ...newCar, fuelType: e.target.value })}
                  />
                  <input
                    type="text"
                    placeholder="Engine"
                    className="p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={newCar.engine}
                    onChange={(e) => setNewCar({ ...newCar, engine: e.target.value })}
                  />
                  <input
                    type="text"
                    placeholder="Image URL"
                    className="p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={newCar.imageUrl}
                    onChange={(e) => setNewCar({ ...newCar, imageUrl: e.target.value })}
                  />
                </div>
                <button
                  className="bg-blue-600 text-white px-6 py-3 rounded-lg mt-6 hover:bg-blue-700 transition-colors duration-300"
                  onClick={handleAddCar}
                >
                  Add Car
                </button>
              </div>
            )}

            {/* Cars in Stock */}
            <h2 className="text-2xl font-bold text-gray-800 mb-4">Cars in Stock</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
              {filteredCars.map(car => (
                <div key={car.id} className="bg-white p-6 rounded-xl shadow-glow hover-scale animate-slide-in">
                  <img src={car.imageUrl} alt={car.name} className="w-full h-48 object-cover rounded-lg mb-4" />
                  <h3 className="text-xl font-semibold text-gray-800">{car.name}</h3>
                  <p className="text-gray-600">Model: {car.model}</p>
                  <p className="text-gray-600">Price: ${parseFloat(car.price).toLocaleString()}</p>
                  <p className="text-gray-600">Fuel Type: {car.fuelType}</p>
                  <p className="text-gray-600">Engine: {car.engine}</p>
                  <div className="mt-4 flex gap-3">
                    <button
                      className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors duration-300"
                      onClick={() => handleSellCar(car)}
                    >
                      Sell
                    </button>
                    <button
                      className="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors duration-300"
                      onClick={() => handleRemoveCar(car.id)}
                    >
                      Remove
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Cars Sold */}
            <h2 className="text-2xl font-bold text-gray-800 mb-4">Cars Sold</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {soldCars.map(car => (
                <div key={car.id} className="bg-white p-6 rounded-xl shadow-glow hover-scale animate-slide-in">
                  <img src={car.imageUrl} alt={car.name} className="w-full h-48 object-cover rounded-lg mb-4" />
                  <h3 className="text-xl font-semibold text-gray-800">{car.name}</h3>
                  <p className="text-gray-600">Model: {car.model}</p>
                  <p className="text-gray-600">Price: ${parseFloat(car.price).toLocaleString()}</p>
                  <p className="text-gray-600">Fuel Type: {car.fuelType}</p>
                  <p className="text-gray-600">Engine: {car.engine}</p>
                </div>
              ))}
            </div>

            {/* Congratulations Popup */}
            {showPopup && (
              <div className="fixed inset-0 flex items-center justify-center bg-black bg-opacity-60">
                <div className="bg-white p-8 rounded-xl shadow-2xl text-center animate-pop max-w-md">
                  <h2 className="text-3xl font-bold text-blue-600">Congratulations! 🎉</h2>
                  <p className="mt-3 text-gray-600">Car sold successfully! Keep shining!</p>
                </div>
              </div>
            )}
          </div>

          {/* Footer */}
          <footer className="bg-gray-800 text-white p-6 mt-12">
            <div className="container mx-auto text-center">
              <p>&copy; 2025 Premire Auto Showroom. All rights reserved.</p>
              <p className="text-sm mt-2">Built with ❤️ for car enthusiasts</p>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
